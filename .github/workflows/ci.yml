name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: voidzero-dev/setup-vp@v1.22.0
        with:
          node-version-file: .node-version
          cache: true
      - name: Install architecture validator
        run: npm ci --prefix .agents/skills/frontend
      - name: Architecture
        run: pnpm arch:check
      - name: Registry
        run: pnpm registry:validate
      - name: Lint, format, types
        run: pnpm check
      - name: Tests
        run: pnpm test
      - name: Build
        run: pnpm build
